[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flashdata-youtube-video-download-api"
version = "0.1.0"
description = "Python YouTube video download API examples with MP4, MP3, clips, cloud delivery and recoverable bulk jobs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "FlashData", email = "support@flashdata.dev" }]
keywords = ["youtube-video-download-api", "youtube-download-api", "youtube", "mp4", "mp3", "cloud-storage", "bulk-download"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["flashdata>=1.2.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2", "twine>=6,<7"]
s3 = ["boto3>=1.35,<2"]

[project.scripts]
flashdata-download = "flashdata_download.cli:main"

[project.urls]
Homepage = "https://github.com/flashdatadev/youtube-video-download-api"
Documentation = "https://flashdata.dev/docs/sources/youtube_download"
Issues = "https://github.com/flashdatadev/youtube-video-download-api/issues"
Source = "https://github.com/flashdatadev/youtube-video-download-api"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flashdata_download = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
